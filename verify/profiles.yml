# Both projects write into one DuckDB file so the comparison can join across schemas:
#   raw        -> jaffle-shop seeds (the RAW_* source tables)
#   reference  -> dbt-labs/jaffle-shop models (ground truth)
#   converted  -> models generated by pwc-to-dbt from the original export
#   repaired   -> models generated from the export with the diagnosed defects patched
default:            # profile name used by dbt-labs/jaffle-shop
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('PWC_DUCKDB_PATH', 'work/jaffle.duckdb') }}"
      schema: reference
      threads: 4
pwc_converted:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('PWC_DUCKDB_PATH', 'work/jaffle.duckdb') }}"
      schema: "{{ env_var('PWC_SCHEMA', 'converted') }}"
      threads: 4
